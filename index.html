  <main class="container">

```
<section class="card">

  <h1>Animal Sightings Dashboard</h1>

  <p id="dashboardStatus">
    Checking account...
  </p>

</section>


<section
  id="dashboardContent"
  style="display: none;"
>

  <div class="card">

    <h2>Today's Sightings</h2>

    <div
      style="
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 15px;
      "
    >

      <div
        style="
          padding: 20px;
          border: 1px solid #ddd;
          text-align: center;
        "
      >
        <h3>Total</h3>
        <p
          id="totalSightings"
          style="font-size: 2rem; margin: 0;"
        >
          0
        </p>
      </div>


      <div
        style="
          padding: 20px;
          border: 1px solid #ddd;
          text-align: center;
        "
      >
        <h3>Kangaroo</h3>
        <p
          id="kangarooCount"
          style="font-size: 2rem; margin: 0;"
        >
          0
        </p>
      </div>


      <div
        style="
          padding: 20px;
          border: 1px solid #ddd;
          text-align: center;
        "
      >
        <h3>Wallaby</h3>
        <p
          id="wallabyCount"
          style="font-size: 2rem; margin: 0;"
        >
          0
        </p>
      </div>


      <div
        style="
          padding: 20px;
          border: 1px solid #ddd;
          text-align: center;
        "
      >
        <h3>Possum</h3>
        <p
          id="possumCount"
          style="font-size: 2rem; margin: 0;"
        >
          0
        </p>
      </div>


      <div
        style="
          padding: 20px;
          border: 1px solid #ddd;
          text-align: center;
        "
      >
        <h3>Koala</h3>
        <p
          id="koalaCount"
          style="font-size: 2rem; margin: 0;"
        >
          0
        </p>
      </div>

    </div>

  </div>


  <div class="card">

    <h2>Recent Sightings</h2>

    <div id="recentSightings">
      Loading sightings...
    </div>

  </div>

</section>
```

  </main>

  <script type="module" src="js/app.js"></script>

</body>

</html>
